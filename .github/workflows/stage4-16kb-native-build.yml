name: Stage 4 - Verify 16 KB FluidSynth

on:
  push:
    branches:
      - stage4-tv-isolated
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-fluidsynth:
    name: Verify Previously Built FluidSynth AAR
    runs-on: ubuntu-latest

    steps:
      - name: Download previously verified FluidSynth AAR
        uses: actions/download-artifact@v4
        with:
          name: fluidsynth-16kb-verified-aar
          repository: donut4u-lgtm/donut4u-karaoke
          run-id: 42462751189
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: verified-aar

      - name: Verify AAR exists
        shell: bash
        run: |
          set -euo pipefail

          AAR="$(find verified-aar -type f -name '*.aar' -print -quit)"

          if [[ -z "$AAR" || ! -s "$AAR" ]]; then
            echo "FAIL: Previously verified AAR is missing."
            exit 1
          fi

          echo "Found: $AAR"
          ls -lh "$AAR"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;30.0.16248370"

      - name: Verify 64-bit native libraries use 16 KB ELF alignment
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          AAR="$(find verified-aar -type f -name '*.aar' -print -quit)"

          mkdir -p aar-check
          unzip -q "$AAR" -d aar-check

          TOTAL=0

          for ABI in arm64-v8a x86_64; do
            DIR="aar-check/jni/$ABI"

            if [[ ! -d "$DIR" ]]; then
              echo "FAIL: Missing ABI directory: $DIR"
              exit 1
            fi

            mapfile -t LIBS < <(
              find "$DIR" -type f -name '*.so' | sort
            )

            if [[ "${#LIBS[@]}" -eq 0 ]]; then
              echo "FAIL: No native libraries for $ABI."
              exit 1
            fi

            for LIB in "${LIBS[@]}"; do
              FOUND=0

              while IFS= read -r LINE; do
                if [[ "$LINE" != *" LOAD "* && "$LINE" != LOAD* ]]; then
                  continue
                fi

                FOUND=1
                ALIGN="${LINE##* }"

                if [[ ! "$ALIGN" =~ ^0x[0-9a-fA-F]+$ ]]; then
                  echo "FAIL: Invalid ELF alignment: $LIB"
                  exit 1
                fi

                VALUE=$((16#${ALIGN#0x}))

                if (( VALUE < 16384 )); then
                  echo "FAIL: Insufficient alignment: $LIB ($ALIGN)"
                  exit 1
                fi

                echo "PASS: $ABI $(basename "$LIB") ($ALIGN)"

              done < <("$READELF" -lW "$LIB")

              if (( FOUND == 0 )); then
                echo "FAIL: No LOAD segments: $LIB"
                exit 1
              fi

              TOTAL=$((TOTAL + 1))
            done
          done

          echo ""
          echo "PASS: $TOTAL native libraries verified."
          echo "PASS: arm64-v8a and x86_64 ELF alignment."

      - name: Upload verified AAR copy
        uses: actions/upload-artifact@v4
        with:
          name: stage4-fluidsynth-aar-reverified
          path: verified-aar/*.aar
          if-no-files-found: error
          retention-days: 14
