name: Stage 4 - Build and Verify 16 KB FluidSynth

on:
  push:
    branches:
      - stage4-tv-isolated
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fluidsynth:
    name: Build and Verify FluidSynth AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Donut4U repository
        uses: actions/checkout@v4

      - name: Checkout FluidSynth 16 KB alignment fix
        uses: actions/checkout@v4
        with:
          repository: Virtover/fluidsynth-kmp
          ref: 0ca21c2e5ba25001d19ebf11d385c82b9e84a0e7
          path: fluidsynth-source

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Build FluidSynth release AAR
        working-directory: fluidsynth-source
        run: |
          chmod +x ./gradlew

          ./gradlew :fluidsynth-kmp:assembleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify 64-bit native libraries use 16 KB ELF alignment
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          AAR="$(find fluidsynth-source/fluidsynth-kmp/build/outputs/aar \
            -maxdepth 1 \
            -type f \
            -name '*.aar' \
            -print -quit)"

          if [[ -z "$AAR" ]]; then
            echo "FAIL: FluidSynth AAR was not generated."
            exit 1
          fi

          mkdir -p aar-check
          unzip -q "$AAR" -d aar-check

          TOTAL=0

          for ABI in arm64-v8a x86_64; do
            ABI_DIR="aar-check/jni/$ABI"

            if [[ ! -d "$ABI_DIR" ]]; then
              echo "FAIL: Missing ABI directory: $ABI_DIR"
              exit 1
            fi

            mapfile -t LIBRARIES < <(
              find "$ABI_DIR" -type f -name '*.so' | sort
            )

            if [[ "${#LIBRARIES[@]}" -eq 0 ]]; then
              echo "FAIL: No native libraries found for $ABI."
              exit 1
            fi

            echo ""
            echo "Checking ABI: $ABI"

            for LIBRARY in "${LIBRARIES[@]}"; do
              echo "Checking: $LIBRARY"

              FOUND_LOAD=0

              while IFS= read -r LINE; do
                if [[ "$LINE" != *" LOAD "* && "$LINE" != LOAD* ]]; then
                  continue
                fi

                FOUND_LOAD=1
                ALIGN="${LINE##* }"

                if [[ ! "$ALIGN" =~ ^0x[0-9a-fA-F]+$ ]]; then
                  echo "FAIL: Invalid LOAD alignment in $LIBRARY"
                  echo "$LINE"
                  exit 1
                fi

                ALIGN_NUM=$((16#${ALIGN#0x}))

                if (( ALIGN_NUM < 16384 )); then
                  echo "FAIL: $LIBRARY has insufficient alignment: $ALIGN"
                  exit 1
                fi

                echo "PASS: LOAD alignment $ALIGN"

              done < <("$READELF" -lW "$LIBRARY")

              if (( FOUND_LOAD == 0 )); then
                echo "FAIL: No LOAD segments found in $LIBRARY"
                exit 1
              fi

              TOTAL=$((TOTAL + 1))
            done
          done

          echo ""
          echo "PASS: All $TOTAL 64-bit native libraries passed 16 KB ELF alignment."
          echo "Checked ABIs: arm64-v8a and x86_64"

      - name: Upload verified FluidSynth AAR
        uses: actions/upload-artifact@v4
        with:
          name: fluidsynth-16kb-verified-aar
          path: fluidsynth-source/fluidsynth-kmp/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 14
