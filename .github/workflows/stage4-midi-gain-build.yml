
name: Stage 4 - MIDI Gain 1.0 Signed Release Build and Verify

on:
  push:
    branches:
      - stage4-tv-isolated
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Gain 1.0 FluidSynth and Signed Donut4U APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Donut4U
        uses: actions/checkout@v4

      - name: Set up Java 21 for FluidSynth
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager -perm -u+x 2>/dev/null \
              | sort -V | tail -n 1)"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "FAIL: Android sdkmanager not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;30.0.16248370"

          echo "PASS: Android SDK and NDK installed."

      - name: Download pinned FluidSynth source
        shell: bash
        run: |
          set -euo pipefail

          git clone https://github.com/Virtover/fluidsynth-kmp.git fluidsynth-source
          cd fluidsynth-source
          git checkout a364bb9cd17834a4c5eb290efaae0845785e3dfe

          echo "PASS: Pinned FluidSynth source checked out."
          git rev-parse HEAD

      - name: Add reliable Maven Central mirror
        working-directory: fluidsynth-source
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          settings = Path("settings.gradle.kts")
          source = settings.read_text()

          old = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }"""

          new = """pluginManagement {
              repositories {
                  maven {
                      url = uri("https://maven-central.storage-download.googleapis.com/maven2")
                  }
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }"""

          if source.count(old) != 1:
              raise SystemExit(
                  "FAIL: Expected pluginManagement repositories block "
                  "was not found exactly once."
              )

          patched = source.replace(old, new, 1)

          if "maven-central.storage-download.googleapis.com/maven2" not in patched:
              raise SystemExit("FAIL: Maven Central mirror was not added.")

          settings.write_text(patched)
          print("PASS: Maven Central mirror added.")
          PY

      - name: Apply Stage 3 MIDI gain 1.0
        shell: bash
        run: |
          set -euo pipefail

          FILE="fluidsynth-source/fluidsynth-kmp/src/androidMain/kotlin/dev/kotlinds/fluidsynthkmp/MidiFilePlayer.kt"

          test -s "$FILE"

          python3 - "$FILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          source = path.read_text()

          old = """    init {
                  FluidSynthJni.sfLoad(context.synthPtr, soundFontPath, true)
                  playerPtr = FluidSynthJni.playerNew(context.synthPtr)
                  FluidSynthJni.playerAdd(playerPtr, midiPath)
              }"""

          new = """    init {
                  FluidSynthJni.sfLoad(context.synthPtr, soundFontPath, true)
                  playerPtr = FluidSynthJni.playerNew(context.synthPtr)
                  FluidSynthJni.playerAdd(playerPtr, midiPath)

                  // Donut4U Stage 3 MIDI/KAR volume adjustment.
                  FluidSynthJni.setGain(context.synthPtr, 1.0f)
              }"""

          if source.count(old) != 1:
              raise SystemExit(
                  "FAIL: Expected MIDI player initialization "
                  "was not found exactly once."
              )

          if "FluidSynthJni.setGain(context.synthPtr, 1.0f)" in source:
              raise SystemExit("FAIL: Gain patch already exists.")

          patched = source.replace(old, new, 1)

          if patched.count("FluidSynthJni.setGain(context.synthPtr, 1.0f)") != 1:
              raise SystemExit("FAIL: Gain patch verification failed.")

          if patched.index("FluidSynthJni.sfLoad") > patched.index(
              "FluidSynthJni.setGain(context.synthPtr, 1.0f)"
          ):
              raise SystemExit("FAIL: Gain must follow SoundFont loading.")

          if patched.index("FluidSynthJni.playerAdd") > patched.index(
              "FluidSynthJni.setGain(context.synthPtr, 1.0f)"
          ):
              raise SystemExit("FAIL: Gain must follow MIDI player setup.")

          path.write_text(patched)
          print("PASS: Stage 3 MIDI gain 1.0 applied.")
          PY

          grep -F 'FluidSynthJni.setGain(context.synthPtr, 1.0f)' "$FILE"

      - name: Apply 16 KB linker alignment to FluidSynth JNI
        shell: bash
        run: |
          set -euo pipefail

          FILE="fluidsynth-source/fluidsynth-kmp/src/androidMain/cpp/CMakeLists.txt"
          test -s "$FILE"

          python3 - "$FILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          source = path.read_text()

          old = "target_link_libraries(fluidsynth_jni fluidsynth ${log-lib})"

          new = """target_link_options(fluidsynth_jni PRIVATE
              "-Wl,-z,max-page-size=16384"
              "-Wl,-z,common-page-size=16384"
          )

          target_link_libraries(fluidsynth_jni fluidsynth ${log-lib})"""

          if source.count(old) != 1:
              raise SystemExit(
                  "FAIL: Expected CMake link target not found exactly once."
              )

          if "max-page-size=16384" in source:
              raise SystemExit("FAIL: 16 KB linker flags already exist.")

          patched = source.replace(old, new, 1)

          if patched.count('"-Wl,-z,max-page-size=16384"') != 1:
              raise SystemExit("FAIL: Maximum page-size flag missing.")

          if patched.count('"-Wl,-z,common-page-size=16384"') != 1:
              raise SystemExit("FAIL: Common page-size flag missing.")

          path.write_text(patched)
          print("PASS: 16 KB linker flags applied.")
          PY

      - name: Build FluidSynth release AAR
        working-directory: fluidsynth-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew :fluidsynth-kmp:assembleRelease \
            --no-daemon \
            --refresh-dependencies \
            --stacktrace \
            --console=plain

          AAR="fluidsynth-kmp/build/outputs/aar/fluidsynth-kmp-release.aar"
          test -s "$AAR"

          mkdir -p ../app/libs
          cp "$AAR" ../app/libs/fluidsynth-kmp-release.aar

          echo "PASS: Gain 1.0 FluidSynth AAR built."
          ls -lh ../app/libs/fluidsynth-kmp-release.aar

      - name: Verify FluidSynth 16 KB native alignment
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          mkdir -p aar-check
          unzip -q app/libs/fluidsynth-kmp-release.aar -d aar-check

          for ABI in arm64-v8a x86_64; do
            DIR="aar-check/jni/$ABI"
            test -d "$DIR"

            mapfile -t LIBS < <(find "$DIR" -type f -name '*.so' | sort)
            test "${#LIBS[@]}" -gt 0

            for LIB in "${LIBS[@]}"; do
              FOUND=0

              while IFS= read -r LINE; do
                [[ "$LINE" == *" LOAD "* || "$LINE" == LOAD* ]] || continue

                FOUND=1
                ALIGN="${LINE##* }"
                [[ "$ALIGN" =~ ^0x[0-9a-fA-F]+$ ]]

                VALUE=$((16#${ALIGN#0x}))

                if (( VALUE < 16384 )); then
                  echo "FAIL: $LIB alignment is $ALIGN"
                  exit 1
                fi
              done < <("$READELF" -lW "$LIB")

              test "$FOUND" -eq 1
              echo "PASS: $ABI $(basename "$LIB")"
            done
          done

          echo "PASS: FluidSynth 16 KB alignment."

      - name: Set up Java 17 for Donut4U
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble and verify SoundFont
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets

          cat \
            soundfont-parts/GeneralUser-GS.sf2.part01 \
            soundfont-parts/GeneralUser-GS.sf2.part02 \
            > app/src/main/assets/GeneralUser-GS.sf2

          test "$(stat -c '%s' app/src/main/assets/GeneralUser-GS.sf2)" -eq 32319396
          test "$(dd if=app/src/main/assets/GeneralUser-GS.sf2 bs=1 count=4 2>/dev/null)" = "RIFF"
          test "$(dd if=app/src/main/assets/GeneralUser-GS.sf2 bs=1 skip=8 count=4 2>/dev/null)" = "sfbk"

          echo "PASS: SoundFont assembled and verified."

      - name: Decrypt existing Donut4U release signing key
        env:
          ENC_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_ENCRYPTION_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$ENC_PASSWORD" || {
            echo "FAIL: DONUT4U_KEYSTORE_ENCRYPTION_PASSWORD is missing."
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "FAIL: DONUT4U_KEYSTORE_PASSWORD is missing."
            exit 1
          }

          test -s signing/donut4u-release.jks.enc

          openssl enc -d -aes-256-cbc \
            -pbkdf2 -iter 200000 \
            -pass env:ENC_PASSWORD \
            -in signing/donut4u-release.jks.enc \
            -out "$RUNNER_TEMP/donut4u-release.jks"

          test -s "$RUNNER_TEMP/donut4u-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/donut4u-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias donut4u

          echo "PASS: Existing Donut4U release key decrypted."

      - name: Build Donut4U signed release APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DONUT4U_KEYSTORE_PATH: ${{ runner.temp }}/donut4u-release.jks
          DONUT4U_KEYSTORE_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}
          DONUT4U_KEY_ALIAS: donut4u
          DONUT4U_KEY_PASSWORD: ${{ secrets.DONUT4U_KEY_PASSWORD }}
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        shell: bash
        run: |
          set -euo pipefail

          test -n "$YOUTUBE_API_KEY" || {
            echo "FAIL: YOUTUBE_API_KEY secret is missing."
            exit 1
          }

          test -n "$DONUT4U_KEY_PASSWORD" || {
            echo "FAIL: DONUT4U_KEY_PASSWORD secret is missing."
            exit 1
          }

          test -s app/libs/fluidsynth-kmp-release.aar
          test -s "$DONUT4U_KEYSTORE_PATH"

          for ATTEMPT in 1 2 3 4; do
            echo "Donut4U signed release build attempt $ATTEMPT/4"

            if gradle assembleRelease \
              --no-daemon \
              --stacktrace \
              --console=plain; then
              echo "PASS: Donut4U signed release APK assembled."
              exit 0
            fi

            if [[ "$ATTEMPT" -lt 4 ]]; then
              sleep 45
            fi
          done

          echo "FAIL: Donut4U signed release build failed."
          exit 1

      - name: Verify APK package, version and integrity
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -s "$APK"
          test -x "$AAPT"

          BADGING="$("$AAPT" dump badging "$APK")"

          echo "$BADGING" | grep -F "package: name='com.donut4u.karaoke'"
          echo "$BADGING" | grep -F "versionCode='26'"
          echo "$BADGING" | grep -F "versionName='1.0.26'"
          echo "$BADGING" | grep -F "sdkVersion:'24'"

          unzip -t "$APK"
          sha256sum "$APK"

          echo "PASS: Package, version and APK integrity verified."

      - name: Verify APK 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          test -s "$APK"

          rm -rf apk-check
          mkdir -p apk-check
          unzip -q "$APK" 'lib/*' -d apk-check

          for ABI in arm64-v8a x86_64; do
            DIR="apk-check/lib/$ABI"
            test -d "$DIR"

            mapfile -t LIBS < <(find "$DIR" -type f -name '*.so' | sort)
            test "${#LIBS[@]}" -gt 0

            for LIB in "${LIBS[@]}"; do
              FOUND=0

              while IFS= read -r LINE; do
                [[ "$LINE" == *" LOAD "* || "$LINE" == LOAD* ]] || continue

                FOUND=1
                ALIGN="${LINE##* }"
                [[ "$ALIGN" =~ ^0x[0-9a-fA-F]+$ ]]

                VALUE=$((16#${ALIGN#0x}))

                if (( VALUE < 16384 )); then
                  echo "FAIL: $LIB alignment is $ALIGN"
                  exit 1
                fi
              done < <("$READELF" -lW "$LIB")

              test "$FOUND" -eq 1
              echo "PASS: $ABI $(basename "$LIB")"
            done
          done

          "$ZIPALIGN" -v -c -P 16 4 "$APK"
          echo "PASS: APK 16 KB verification."

      - name: Verify APK signature and existing release certificate
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          KEYSTORE="$RUNNER_TEMP/donut4u-release.jks"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -s "$APK"
          test -s "$KEYSTORE"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          EXPECTED_CERT_SHA="$(
            keytool -exportcert \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASSWORD" \
              -alias donut4u \
              | sha256sum | awk '{print tolower($1)}'
          )"

          ACTUAL_CERT_SHA="$(
            "$APKSIGNER" verify --print-certs "$APK" \
              | awk -F': ' \
                '/Signer #1 certificate SHA-256 digest:/ {
                  gsub(/:/, "", $2)
                  print tolower($2)
                  exit
                }'
          )"

          if [[ -z "$EXPECTED_CERT_SHA" || -z "$ACTUAL_CERT_SHA" ]]; then
            echo "FAIL: Could not read signing certificate fingerprints."
            exit 1
          fi

          echo "Expected release certificate: $EXPECTED_CERT_SHA"
          echo "APK certificate:              $ACTUAL_CERT_SHA"

          if [[ "$EXPECTED_CERT_SHA" != "$ACTUAL_CERT_SHA" ]]; then
            echo "FAIL: APK certificate does not match the existing release key."
            exit 1
          fi

          echo "PASS: APK uses the existing Donut4U release signing certificate."

      - name: Upload signed Gain 1.0 release APK
        uses: actions/upload-artifact@v4
        with:
          name: stage4-midi-gain-10-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload rebuilt Gain 1.0 FluidSynth AAR
        uses: actions/upload-artifact@v4
        with:
          name: stage4-midi-gain-10-verified-aar
          path: app/libs/fluidsynth-kmp-release.aar
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/donut4u-release.jks"
