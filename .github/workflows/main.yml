name: Create Donut4U Signing Key

on:
  workflow_dispatch:

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Generate signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore donut4u-release.jks \
            -alias donut4u \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.DONUT4U_KEY_PASSWORD }}" \
            -dname "CN=Donut4U Karaoke, OU=Android, O=Donut4U, L=Calamba, ST=Laguna, C=PH"

      - name: Encode signing key
        run: |
          base64 -w 0 donut4u-release.jks > donut4u-release-base64.txt

      - name: Upload encoded signing key
        uses: actions/upload-artifact@v4
        with:
          name: donut4u-signing-key-setup
          path: donut4u-release-base64.txt
          retention-days: 1
