
name: Create Donut4U Signing Key

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check required passwords
        env:
          STORE_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DONUT4U_KEY_PASSWORD }}
          ENCRYPT_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_ENCRYPTION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${#STORE_PASSWORD}" -lt 6 ]; then
            echo "ERROR: DONUT4U_KEYSTORE_PASSWORD must be at least 6 characters."
            exit 1
          fi

          if [ "${#KEY_PASSWORD}" -lt 6 ]; then
            echo "ERROR: DONUT4U_KEY_PASSWORD must be at least 6 characters."
            exit 1
          fi

          if [ "${#ENCRYPT_PASSWORD}" -lt 20 ]; then
            echo "ERROR: DONUT4U_KEYSTORE_ENCRYPTION_PASSWORD must be at least 20 characters."
            exit 1
          fi

      - name: Generate and encrypt signing key
        env:
          STORE_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DONUT4U_KEY_PASSWORD }}
          ENCRYPT_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_ENCRYPTION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p signing

          if [ -e signing/donut4u-release.jks.enc ]; then
            echo "ERROR: Signing key file already exists. Refusing to overwrite it."
            exit 1
          fi

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/donut4u-release.jks" \
            -alias donut4u \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Donut4U Karaoke, OU=Android, O=Donut4U, L=Calamba, ST=Laguna, C=PH"

          keytool -list \
            -keystore "$RUNNER_TEMP/donut4u-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias donut4u

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/donut4u-release.jks" \
            -out signing/donut4u-release.jks.enc \
            -pass env:ENCRYPT_PASSWORD

          test -s signing/donut4u-release.jks.enc

          rm -f "$RUNNER_TEMP/donut4u-release.jks"

          echo "Encrypted signing key created successfully."

      - name: Save encrypted key to repository
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add signing/donut4u-release.jks.enc
          git commit -m "Add encrypted Donut4U release signing key"
          git push origin HEAD:main

          echo "Encrypted signing key saved to main."
