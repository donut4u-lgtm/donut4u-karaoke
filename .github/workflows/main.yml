name: Create Donut4U Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Check required passwords
        env:
          STORE_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DONUT4U_KEY_PASSWORD }}
        run: |
          if [ "${#STORE_PASSWORD}" -lt 6 ]; then
            echo "ERROR: DONUT4U_KEYSTORE_PASSWORD must be at least 6 characters."
            exit 1
          fi

          if [ "${#KEY_PASSWORD}" -lt 6 ]; then
            echo "ERROR: DONUT4U_KEY_PASSWORD must be at least 6 characters."
            exit 1
          fi

      - name: Generate signing key
        env:
          STORE_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DONUT4U_KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/donut4u-release.jks" \
            -alias donut4u \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Donut4U Karaoke, OU=Android, O=Donut4U, L=Calamba, ST=Laguna, C=PH"

          echo "Signing key generated successfully."

      - name: Stop before exposing key
        run: |
          echo "Key generated in temporary runner storage."
          echo "It has not been saved as a repository secret."
          echo "Do not use this key for a release until secure storage is configured."
