
name: Stage 4 TV Build and 16 KB APK Verification

on:
  push:
    branches:
      - stage4-tv-isolated
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-and-verify:
    name: Build Donut4U and Verify 16 KB APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Donut4U
        uses: actions/checkout@v4

      - name: Download previously verified FluidSynth AAR
        uses: actions/download-artifact@v4
        with:
          name: fluidsynth-16kb-verified-aar
          repository: donut4u-lgtm/donut4u-karaoke
          run-id: 42462751189
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: verified-aar

      - name: Install verified FluidSynth AAR
        shell: bash
        run: |
          set -euo pipefail

          AAR="$(find verified-aar -type f -name '*.aar' -print -quit)"

          if [[ -z "$AAR" || ! -s "$AAR" ]]; then
            echo "FAIL: FluidSynth AAR was not downloaded."
            exit 1
          fi

          mkdir -p app/libs
          cp "$AAR" app/libs/fluidsynth-kmp-release.aar

          test -s app/libs/fluidsynth-kmp-release.aar
          ls -lh app/libs/fluidsynth-kmp-release.aar

          echo "PASS: FluidSynth AAR installed."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager -perm -u+x 2>/dev/null \
              | sort -V | tail -n 1)"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "FAIL: Android sdkmanager not found."
            find "$SDK_ROOT" -maxdepth 5 -name sdkmanager -print || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "Android SDK: $SDK_ROOT"
          echo "SDK manager: $SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;30.0.16248370"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble and verify SoundFont
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets

          cat \
            soundfont-parts/GeneralUser-GS.sf2.part01 \
            soundfont-parts/GeneralUser-GS.sf2.part02 \
            > app/src/main/assets/GeneralUser-GS.sf2

          test "$(stat -c '%s' app/src/main/assets/GeneralUser-GS.sf2)" -eq 32319396

          test "$(dd if=app/src/main/assets/GeneralUser-GS.sf2 bs=1 count=4 2>/dev/null)" = "RIFF"

          test "$(dd if=app/src/main/assets/GeneralUser-GS.sf2 bs=1 skip=8 count=4 2>/dev/null)" = "sfbk"

          echo "PASS: SoundFont assembled and verified."

      - name: Build Donut4U debug APK with dependency-download retries
        env:
          YOUTUBE_API_KEY: ""
          DONUT4U_KEYSTORE_PATH: ${{ runner.temp }}/unused.jks
          DONUT4U_KEYSTORE_PASSWORD: unused
          DONUT4U_KEY_ALIAS: unused
          DONUT4U_KEY_PASSWORD: unused
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        shell: bash
        run: |
          set -euo pipefail

          test -s app/libs/fluidsynth-kmp-release.aar

          for ATTEMPT in 1 2 3 4; do
            echo "Donut4U APK build attempt $ATTEMPT/4"

            if gradle assembleDebug --no-daemon --stacktrace --console=plain; then
              echo "PASS: Donut4U debug APK assembled."
              exit 0
            fi

            if [[ "$ATTEMPT" -lt 4 ]]; then
              echo "Build failed. Waiting 45 seconds before retry."
              sleep 45
            fi
          done

          echo "FAIL: Donut4U APK build failed after four attempts."
          exit 1

      - name: Verify final APK ELF and ZIP alignment
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          test -s "$APK"
          test -x "$READELF"
          test -x "$ZIPALIGN"

          rm -rf apk-check
          mkdir -p apk-check

          unzip -q "$APK" 'lib/*' -d apk-check

          TOTAL=0

          for ABI in arm64-v8a x86_64; do
            DIR="apk-check/lib/$ABI"

            if [[ ! -d "$DIR" ]]; then
              echo "FAIL: APK is missing $ABI native libraries."
              exit 1
            fi

            mapfile -t LIBS < <(find "$DIR" -type f -name '*.so' | sort)

            if [[ "${#LIBS[@]}" -eq 0 ]]; then
              echo "FAIL: No native libraries found for $ABI."
              exit 1
            fi

            for LIB in "${LIBS[@]}"; do
              FOUND=0

              while IFS= read -r LINE; do
                if [[ "$LINE" != *" LOAD "* && "$LINE" != LOAD* ]]; then
                  continue
                fi

                FOUND=1
                ALIGN="${LINE##* }"

                if [[ ! "$ALIGN" =~ ^0x[0-9a-fA-F]+$ ]]; then
                  echo "FAIL: Could not parse ELF LOAD alignment in $LIB: $ALIGN"
                  exit 1
                fi

                VALUE=$((16#${ALIGN#0x}))

                if (( VALUE < 16384 )); then
                  echo "FAIL: $LIB has a LOAD segment aligned below 16 KB ($ALIGN)."
                  exit 1
                fi
              done < <("$READELF" -lW "$LIB")

              if (( FOUND == 0 )); then
                echo "FAIL: No ELF LOAD segments found in $LIB."
                exit 1
              fi

              echo "PASS: $ABI $(basename "$LIB")"
              TOTAL=$((TOTAL + 1))
            done
          done

          echo "Checking APK ZIP alignment..."

          "$ZIPALIGN" -v -c -P 16 4 "$APK"

          echo "PASS: Final APK passed ELF and ZIP alignment checks."
          echo "Verified 64-bit native libraries: $TOTAL"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: stage4-tv-16kb-verified-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
