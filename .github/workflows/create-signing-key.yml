
name: Create and Save Donut4U Signing Key

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check required secrets
        env:
          STORE_PASS: ${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.DONUT4U_KEY_PASSWORD }}
          ENCRYPT_PASS: ${{ secrets.DONUT4U_KEYSTORE_ENCRYPTION_PASSWORD }}
        run: |
          set -e
          if [ -z "$STORE_PASS" ] || [ -z "$KEY_PASS" ] || [ -z "$ENCRYPT_PASS" ]; then
            echo "ERROR: Configure all three required GitHub Actions secrets."
            exit 1
          fi
          if [ "${#ENCRYPT_PASS}" -lt 20 ]; then
            echo "ERROR: Encryption password must be at least 20 characters."
            exit 1
          fi

      - name: Create and encrypt signing key
        env:
          STORE_PASS: ${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.DONUT4U_KEY_PASSWORD }}
          ENCRYPT_PASS: ${{ secrets.DONUT4U_KEYSTORE_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p signing
          test ! -e signing/donut4u-release.jks.enc || {
            echo "ERROR: Encrypted signing key already exists. Refusing to overwrite it."
            exit 1
          }

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/donut4u-release.jks" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias donut4u \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Donut4U Karaoke, OU=Mobile, O=Donut4U, L=Manila, ST=Metro Manila, C=PH"

          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in "$RUNNER_TEMP/donut4u-release.jks" \
            -out signing/donut4u-release.jks.enc \
            -pass env:ENCRYPT_PASS

          keytool -list \
            -keystore "$RUNNER_TEMP/donut4u-release.jks" \
            -storepass "$STORE_PASS" \
            -alias donut4u

          rm -f "$RUNNER_TEMP/donut4u-release.jks"

      - name: Commit encrypted signing key
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/donut4u-release.jks.enc
          git commit -m "Add encrypted Donut4U release signing key"
          git push origin HEAD:main
