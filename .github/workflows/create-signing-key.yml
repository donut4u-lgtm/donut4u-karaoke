
name: Create and Save Donut4U Signing Key

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          STORE_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DONUT4U_KEY_PASSWORD }}
          ENC_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_ENCRYPTION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${#STORE_PASSWORD}" -lt 6 ]; then
            echo "ERROR: DONUT4U_KEYSTORE_PASSWORD is missing or too short."
            exit 1
          fi

          if [ "${#KEY_PASSWORD}" -lt 6 ]; then
            echo "ERROR: DONUT4U_KEY_PASSWORD is missing or too short."
            exit 1
          fi

          if [ "${#ENC_PASSWORD}" -lt 20 ]; then
            echo "ERROR: DONUT4U_KEYSTORE_ENCRYPTION_PASSWORD must be at least 20 characters."
            exit 1
          fi

      - name: Generate and encrypt signing key
        env:
          STORE_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DONUT4U_KEY_PASSWORD }}
          ENC_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_ENCRYPTION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p signing

          if [ -s signing/donut4u-release.jks.enc ]; then
            echo "ERROR: An encrypted signing key already exists."
            echo "Refusing to replace the existing signing identity."
            exit 1
          fi

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/donut4u-release.jks" \
            -alias donut4u \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Donut4U Karaoke, OU=Android, O=Donut4U, L=Naga, ST=Bicol, C=PH"

          keytool -list \
            -keystore "$RUNNER_TEMP/donut4u-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias donut4u

          openssl enc -aes-256-cbc -salt \
            -pbkdf2 -iter 200000 \
            -pass env:ENC_PASSWORD \
            -in "$RUNNER_TEMP/donut4u-release.jks" \
            -out signing/donut4u-release.jks.enc

          test -s signing/donut4u-release.jks.enc

      - name: Save encrypted key to GitHub
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add signing/donut4u-release.jks.enc

          if git diff --cached --quiet; then
            echo "ERROR: No encrypted signing key was staged."
            exit 1
          fi

          git commit -m "Save encrypted Donut4U signing key"
          git push origin HEAD:main

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/donut4u-release.jks"
