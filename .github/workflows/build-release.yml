
name: Build Donut4U Signed Release APK

on:
  push:
    branches:
      - main
      - stage4-tv-isolated
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout pinned FluidSynth source
        uses: actions/checkout@v4
        with:
          repository: Virtover/fluidsynth-kmp
          ref: 0ca21c2e5ba25001d19ebf11d385c82b9e84a0e7
          path: fluidsynth-source

      - name: Set up Java 21 for FluidSynth
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Build FluidSynth release AAR
        working-directory: fluidsynth-source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          ./gradlew :fluidsynth-kmp:assembleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify FluidSynth 16 KB ELF alignment
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          AAR="$(find fluidsynth-source/fluidsynth-kmp/build/outputs/aar \
            -maxdepth 1 -type f -name '*.aar' -print -quit)"

          if [[ -z "$AAR" || ! -s "$AAR" ]]; then
            echo "ERROR: FluidSynth AAR was not generated."
            exit 1
          fi

          mkdir -p aar-check
          unzip -q "$AAR" -d aar-check

          TOTAL=0

          for ABI in arm64-v8a x86_64; do
            ABI_DIR="aar-check/jni/$ABI"

            if [[ ! -d "$ABI_DIR" ]]; then
              echo "ERROR: Missing ABI directory: $ABI_DIR"
              exit 1
            fi

            mapfile -t LIBRARIES < <(
              find "$ABI_DIR" -type f -name '*.so' | sort
            )

            if [[ "${#LIBRARIES[@]}" -eq 0 ]]; then
              echo "ERROR: No native libraries for $ABI."
              exit 1
            fi

            for LIBRARY in "${LIBRARIES[@]}"; do
              FOUND_LOAD=0

              while IFS= read -r LINE; do
                if [[ "$LINE" != *" LOAD "* && "$LINE" != LOAD* ]]; then
                  continue
                fi

                FOUND_LOAD=1
                ALIGN="${LINE##* }"

                if [[ ! "$ALIGN" =~ ^0x[0-9a-fA-F]+$ ]]; then
                  echo "ERROR: Invalid ELF alignment: $LIBRARY"
                  exit 1
                fi

                ALIGN_NUM=$((16#${ALIGN#0x}))

                if (( ALIGN_NUM < 16384 )); then
                  echo "ERROR: Insufficient alignment: $LIBRARY ($ALIGN)"
                  exit 1
                fi

                echo "PASS: $ABI $(basename "$LIBRARY") ($ALIGN)"
              done < <("$READELF" -lW "$LIBRARY")

              if (( FOUND_LOAD == 0 )); then
                echo "ERROR: No LOAD segments: $LIBRARY"
                exit 1
              fi

              TOTAL=$((TOTAL + 1))
            done
          done

          echo "PASS: $TOTAL native libraries verified for 16 KB alignment."

      - name: Install verified FluidSynth AAR
        shell: bash
        run: |
          set -euo pipefail

          AAR="$(find fluidsynth-source/fluidsynth-kmp/build/outputs/aar \
            -maxdepth 1 -type f -name '*.aar' -print -quit)"

          test -n "$AAR"
          test -s "$AAR"

          mkdir -p app/libs
          cp "$AAR" app/libs/fluidsynth-kmp-release.aar

          echo "FluidSynth AAR installed:"
          ls -lh app/libs/fluidsynth-kmp-release.aar

      - name: Assemble bundled GeneralUser SoundFont
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets

          cat \
            soundfont-parts/GeneralUser-GS.sf2.part01 \
            soundfont-parts/GeneralUser-GS.sf2.part02 \
            > app/src/main/assets/GeneralUser-GS.sf2

          test "$(stat -c '%s' app/src/main/assets/GeneralUser-GS.sf2)" -eq 32319396

          test "$(dd if=app/src/main/assets/GeneralUser-GS.sf2 bs=1 count=4 2>/dev/null)" = "RIFF"
          test "$(dd if=app/src/main/assets/GeneralUser-GS.sf2 bs=1 skip=8 count=4 2>/dev/null)" = "sfbk"

          echo "GeneralUser SoundFont assembled and verified."
          sha256sum app/src/main/assets/GeneralUser-GS.sf2

      - name: Set up Java 17 for Donut4U
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          echo "Android SDK: $ANDROID_HOME"

      - name: Decrypt signing key
        env:
          ENC_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_ENCRYPTION_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ENC_PASSWORD"
          test -n "$STORE_PASSWORD"

          openssl enc -d -aes-256-cbc \
            -pbkdf2 -iter 200000 \
            -pass env:ENC_PASSWORD \
            -in signing/donut4u-release.jks.enc \
            -out "$RUNNER_TEMP/donut4u-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/donut4u-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias donut4u

      - name: Build signed release APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DONUT4U_KEYSTORE_PATH: ${{ runner.temp }}/donut4u-release.jks
          DONUT4U_KEYSTORE_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}
          DONUT4U_KEY_ALIAS: donut4u
          DONUT4U_KEY_PASSWORD: ${{ secrets.DONUT4U_KEY_PASSWORD }}
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_API_KEY"
          gradle assembleRelease --no-daemon --stacktrace --console=plain

      - name: Find release APK
        id: find_apk
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          mkdir -p "$RUNNER_TEMP/verified-release"
          cp "$APK" "$RUNNER_TEMP/verified-release/Donut4U-Karaoke.apk"
          echo "apk_path=$RUNNER_TEMP/verified-release/Donut4U-Karaoke.apk" >> "$GITHUB_OUTPUT"

      - name: Verify APK file integrity
        env:
          APK: ${{ steps.find_apk.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$APK"
          stat -c '%s bytes' "$APK"
          sha256sum "$APK"

      - name: Verify package and version
        env:
          APK: ${{ steps.find_apk.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"

          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING"

          echo "$BADGING" | grep -F "package: name='com.donut4u.karaoke'"
          echo "$BADGING" | grep -F "versionCode='26'"
          echo "$BADGING" | grep -F "versionName='1.0.26'"
          echo "$BADGING" | grep -F "sdkVersion:'24'"

      - name: Verify APK alignment
        env:
          APK: ${{ steps.find_apk.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -v 4 "$APK"

      - name: Verify APK signature
        env:
          APK: ${{ steps.find_apk.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Create update version file
        shell: bash
        run: |
          set -euo pipefail
          echo "26" > version.txt

      - name: Publish APK to public GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ steps.find_apk.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="v1.0.26"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$APK#Donut4U-Karaoke.apk" \
              version.txt \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$APK#Donut4U-Karaoke.apk" \
              version.txt \
              --title "Donut4U Karaoke v1.0.26" \
              --notes "Public signed APK release for Donut4U Karaoke version 1.0.26."
          fi

      - name: Upload verified APK backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: donut4u-karaoke-verified-release-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/donut4u-release.jks"
