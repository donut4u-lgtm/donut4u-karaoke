
name: Build Donut4U Signed Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decrypt signing key
        env:
          ENC_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_ENCRYPTION_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$ENC_PASSWORD" || {
            echo "ERROR: Keystore encryption password secret is missing."
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "ERROR: Keystore password secret is missing."
            exit 1
          }

          openssl enc -d -aes-256-cbc \
            -pbkdf2 -iter 200000 \
            -pass env:ENC_PASSWORD \
            -in signing/donut4u-release.jks.enc \
            -out "$RUNNER_TEMP/donut4u-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/donut4u-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias donut4u

      - name: Build signed release APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DONUT4U_KEYSTORE_PATH: ${{ runner.temp }}/donut4u-release.jks
          DONUT4U_KEYSTORE_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}
          DONUT4U_KEY_ALIAS: donut4u
          DONUT4U_KEY_PASSWORD: ${{ secrets.DONUT4U_KEY_PASSWORD }}
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "ERROR: YOUTUBE_API_KEY secret is missing."
            exit 1
          fi

          gradle assembleRelease --no-daemon --stacktrace --console=plain

      - name: Find release APK
        id: find_apk
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for generated release APK files..."

          find app/build/outputs/apk -type f -name '*.apk' -print 2>/dev/null || true

          APK="$(find app/build/outputs/apk -type f -name '*.apk' \
            ! -name '*-unsigned.apk' \
            ! -name '*-unaligned.apk' \
            -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "ERROR: No usable release APK was generated."
            echo "Check the Gradle build output and signing configuration."
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Verify APK signature
        env:
          APK: ${{ steps.find_apk.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: Android apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Create update version file
        shell: bash
        run: |
          set -euo pipefail
          echo "$GITHUB_RUN_NUMBER" > version.txt
          echo "Update version code: $(cat version.txt)"

      - name: Replace APK and version file in GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ steps.find_apk.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view v1.0.0 >/dev/null 2>&1; then
            echo "ERROR: GitHub Release v1.0.0 does not exist."
            echo "Create the release first or update the workflow to use the intended release tag."
            exit 1
          fi

          gh release upload v1.0.0 \
            "$APK#Donut4U-Karaoke.apk" \
            version.txt \
            --clobber

      - name: Upload APK backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: donut4u-karaoke-signed-release-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/donut4u-release.jks"
