name: Build Donut4U Signed Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          echo "Android SDK: $ANDROID_HOME"

      - name: Decrypt signing key
        env:
          ENC_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_ENCRYPTION_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ENC_PASSWORD"
          test -n "$STORE_PASSWORD"

          openssl enc -d -aes-256-cbc \
            -pbkdf2 -iter 200000 \
            -pass env:ENC_PASSWORD \
            -in signing/donut4u-release.jks.enc \
            -out "$RUNNER_TEMP/donut4u-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/donut4u-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias donut4u

      - name: Build signed release APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DONUT4U_KEYSTORE_PATH: ${{ runner.temp }}/donut4u-release.jks
          DONUT4U_KEYSTORE_PASSWORD: ${{ secrets.DONUT4U_KEYSTORE_PASSWORD }}
          DONUT4U_KEY_ALIAS: donut4u
          DONUT4U_KEY_PASSWORD: ${{ secrets.DONUT4U_KEY_PASSWORD }}
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_API_KEY"
          gradle assembleRelease --no-daemon --stacktrace --console=plain

      - name: Find release APK
        id: find_apk
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          mkdir -p "$RUNNER_TEMP/verified-release"
          cp "$APK" "$RUNNER_TEMP/verified-release/Donut4U-Karaoke.apk"
          echo "apk_path=$RUNNER_TEMP/verified-release/Donut4U-Karaoke.apk" >> "$GITHUB_OUTPUT"

      - name: Verify APK file integrity
        env:
          APK: ${{ steps.find_apk.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$APK"
          stat -c '%s bytes' "$APK"
          sha256sum "$APK"

      - name: Verify package and version
        env:
          APK: ${{ steps.find_apk.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"

          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING"

          echo "$BADGING" | grep -F "package: name='com.donut4u.karaoke'"
          echo "$BADGING" | grep -F "versionCode='26'"
          echo "$BADGING" | grep -F "versionName='1.0.26'"
          echo "$BADGING" | grep -F "sdkVersion:'24'"

      - name: Verify APK alignment
        env:
          APK: ${{ steps.find_apk.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -v 4 "$APK"

      - name: Verify APK signature
        env:
          APK: ${{ steps.find_apk.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Create update version file
        shell: bash
        run: |
          set -euo pipefail
          echo "26" > version.txt

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ steps.find_apk.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.0.0 >/dev/null
          gh release upload v1.0.0 \
            "$APK#Donut4U-Karaoke.apk" \
            version.txt \
            --clobber

      - name: Upload verified APK backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: donut4u-karaoke-verified-release-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/donut4u-release.jks"
