
name: Build donut4u karaoke APK

on:
  push:
    branches:
      - main
      - stage4-tv-isolated
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified FluidSynth AAR
        uses: actions/download-artifact@v4
        with:
          name: fluidsynth-16kb-verified-aar
          repository: donut4u-lgtm/donut4u-karaoke
          run-id: 42462751189
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: verified-aar

      - name: Install FluidSynth AAR
        shell: bash
        run: |
          set -euo pipefail

          AAR="$(find verified-aar -type f -name '*.aar' -print -quit)"

          if [[ -z "$AAR" || ! -s "$AAR" ]]; then
            echo "ERROR: Verified FluidSynth AAR is missing."
            exit 1
          fi

          mkdir -p app/libs
          cp "$AAR" app/libs/fluidsynth-kmp-release.aar

          echo "FluidSynth AAR installed:"
          ls -lh app/libs/fluidsynth-kmp-release.aar

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: donut4u-karaoke-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
