
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="theme-color"
        content="#071b25"
    >
    <title>Donut4U Karaoke Cast</title>

    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #071b25;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        cast-media-player {
            width: 100%;
            height: 100%;
            --theme-hue: 145;
            --progress-color: #22c55e;
            --splash-image: none;
            --splash-size: cover;
        }

        #karaoke-screen {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4vh 5vw;
            pointer-events: none;
            background:
                linear-gradient(
                    180deg,
                    rgba(3, 18, 27, 0.92) 0%,
                    rgba(3, 18, 27, 0.30) 35%,
                    rgba(3, 18, 27, 0.45) 65%,
                    rgba(3, 18, 27, 0.96) 100%
                );
        }

        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        #brand {
            font-size: clamp(24px, 3vw, 42px);
            font-weight: 800;
            letter-spacing: 1px;
            color: #4ade80;
        }

        #connection {
            font-size: clamp(13px, 1.5vw, 20px);
            color: #bbf7d0;
            text-align: right;
        }

        #song-information {
            margin-top: 3vh;
            text-align: center;
        }

        #song-title {
            margin: 0;
            font-size: clamp(30px, 5vw, 68px);
            line-height: 1.15;
            font-weight: 800;
            text-shadow: 0 3px 12px #000000;
        }

        #song-artist {
            margin-top: 14px;
            font-size: clamp(18px, 2.4vw, 32px);
            color: #bbf7d0;
        }

        #lyrics-area {
            width: 100%;
            max-width: 1500px;
            margin: auto auto;
            padding: 3vh 2vw;
            text-align: center;
        }

        #lyrics {
            min-height: 2.5em;
            font-size: clamp(30px, 5vw, 72px);
            line-height: 1.3;
            font-weight: 800;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: #ffffff;
            text-shadow:
                0 3px 8px #000000,
                0 0 24px rgba(0, 0, 0, 0.8);
        }

        #next-lyrics {
            min-height: 1.5em;
            margin-top: 2vh;
            font-size: clamp(18px, 2.5vw, 34px);
            color: #cbd5e1;
            opacity: 0.85;
            text-shadow: 0 2px 8px #000000;
        }

        #footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            font-size: clamp(13px, 1.6vw, 21px);
            color: #cbd5e1;
        }

        #stage-label {
            color: #4ade80;
            font-weight: 700;
        }

        #score {
            color: #facc15;
            font-weight: 700;
        }

        #waiting {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            background: #071b25;
        }

        #waiting h1 {
            margin: 0;
            color: #4ade80;
            font-size: clamp(34px, 6vw, 76px);
        }

        #waiting p {
            max-width: 850px;
            margin-top: 20px;
            color: #cbd5e1;
            font-size: clamp(18px, 2.5vw, 30px);
            line-height: 1.5;
        }

        #waiting.hidden {
            display: none;
        }

        #karaoke-screen.hidden {
            display: none;
        }
    </style>
</head>

<body>
    <cast-media-player></cast-media-player>

    <main id="waiting">
        <h1>Donut4U Karaoke</h1>
        <p>
            Ready to connect.
            Open Donut4U Karaoke on your phone
            and connect to this Cast receiver.
        </p>
    </main>

    <section id="karaoke-screen" class="hidden">
        <header id="header">
            <div id="brand">Donut4U Karaoke</div>
            <div id="connection">Google Cast connected</div>
        </header>

        <section id="song-information">
            <h1 id="song-title">Waiting for song</h1>
            <div id="song-artist">Donut4U Karaoke</div>
        </section>

        <section id="lyrics-area">
            <div id="lyrics">Ready to sing!</div>
            <div id="next-lyrics"></div>
        </section>

        <footer id="footer">
            <div id="stage-label">DONUT4U</div>
            <div id="score"></div>
        </footer>
    </section>

    <script>
        (function () {
            "use strict";

            const NAMESPACE =
                "urn:x-cast:com.donut4u.karaoke";

            const waiting =
                document.getElementById("waiting");

            const screen =
                document.getElementById("karaoke-screen");

            const title =
                document.getElementById("song-title");

            const artist =
                document.getElementById("song-artist");

            const lyrics =
                document.getElementById("lyrics");

            const nextLyrics =
                document.getElementById("next-lyrics");

            const stage =
                document.getElementById("stage-label");

            const score =
                document.getElementById("score");

            function safeText(value, fallback) {
                if (typeof value !== "string") {
                    return fallback;
                }

                const trimmed = value.trim();

                return trimmed.length > 0
                    ? trimmed
                    : fallback;
            }

            function showKaraokeScreen() {
                waiting.classList.add("hidden");
                screen.classList.remove("hidden");
            }

            function showWaitingScreen() {
                screen.classList.add("hidden");
                waiting.classList.remove("hidden");
            }

            function handleMessage(event) {
                let data = event.data;

                if (typeof data === "string") {
                    try {
                        data = JSON.parse(data);
                    } catch (error) {
                        console.warn(
                            "Ignored invalid Donut4U message."
                        );
                        return;
                    }
                }

                if (
                    data === null ||
                    typeof data !== "object"
                ) {
                    return;
                }

                if (data.type === "clear") {
                    title.textContent = "Waiting for song";
                    artist.textContent = "Donut4U Karaoke";
                    lyrics.textContent = "Ready to sing!";
                    nextLyrics.textContent = "";
                    stage.textContent = "DONUT4U";
                    score.textContent = "";
                    showWaitingScreen();
                    return;
                }

                if (data.type !== "karaoke") {
                    return;
                }

                title.textContent = safeText(
                    data.title,
                    "Donut4U Karaoke"
                );

                artist.textContent = safeText(
                    data.artist,
                    " "
                );

                lyrics.textContent = safeText(
                    data.lyrics,
                    " "
                );

                nextLyrics.textContent = safeText(
                    data.nextLyrics,
                    ""
                );

                stage.textContent = safeText(
                    data.stage,
                    "DONUT4U"
                );

                if (
                    typeof data.score === "number" &&
                    Number.isFinite(data.score)
                ) {
                    score.textContent =
                        "SCORE: " +
                        Math.round(data.score);
                } else {
                    score.textContent = "";
                }

                showKaraokeScreen();
            }

            function initializeReceiver() {
                const context =
                    cast.framework.CastReceiverContext
                        .getInstance();

                context.addCustomMessageListener(
                    NAMESPACE,
                    handleMessage
                );

                context.addEventListener(
                    cast.framework.system.EventType.READY,
                    function () {
                        console.log(
                            "Donut4U Cast receiver is ready."
                        );
                    }
                );

                context.addEventListener(
                    cast.framework.system.EventType.SHUTDOWN,
                    function () {
                        showWaitingScreen();
                    }
                );

                context.start();

                console.log(
                    "Donut4U Cast receiver initialized."
                );
            }

            window.addEventListener(
                "load",
                initializeReceiver
            );
        })();
    </script>
</body>
</html>
